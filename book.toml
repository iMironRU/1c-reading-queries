[book]
title = "Название книги"        # обновляется через ./book.sh init
authors = ["Автор"]
language = "ru"
src = "."

[build]
build-dir = "book"

[output.html]
site-url = "/"
git-repository-url = ""
edit-url-template = ""
additional-js = ["theme/version.js", "theme/status.js"]
additional-css = ["theme/book-extra.css"]
no-section-label = true          # нумерация своя, в заголовках параграфов
fold.enable = true
fold.level = 0                  # главы свёрнуты; текущая раскрывается сама
search.enable = true
search.limit-results = 30
search.teaser-word-count = 30

[output.html.playground]
editable = false
