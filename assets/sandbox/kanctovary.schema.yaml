# База «Канцтовары» — сквозной пример серии «Чтение 1С».
#
# Формат — учебная схема песочницы языка запросов BSLexicon (query-sandbox, v1):
# https://github.com/iMironRU/BSLexicon/blob/main/docs/query-sandbox/README.md
#
# Состав базы взят из книги «Дерево метаданных 1С» и не меняется от книги
# к книге: справочники Товары, Контрагенты, Склады; документы поступления и
# реализации; регистр остатков ТоварыНаСкладах, регистр оборотов Продажи,
# регистр сведений ЦеныТоваров. Справочник ЕдиницыИзмерения добавлен ради
# примеров третьей главы «Чтения данных»: там цепочка точек идёт
# от строки реализации через товар к его единице измерения.
#
# Данные — kanctovary.data.yaml рядом.

version: 1

tables:

  # ── Справочники ────────────────────────────────────────────────

  - kind: Справочник
    name: Товары
    hierarchical: true
    fields:
      - { name: Ссылка, type: УникальныйИдентификатор, key: true }
      - { name: Код, type: Строка(9) }
      - { name: Наименование, type: Строка(100) }
      - { name: Артикул, type: Строка(20) }
      - { name: ЕдиницаИзмерения, type: Ссылка, refs: Справочник.ЕдиницыИзмерения }
      - { name: Родитель, type: Ссылка, refs: Справочник.Товары }
      - { name: ЭтоГруппа, type: Булево }
      - { name: ПометкаУдаления, type: Булево }

  - kind: Справочник
    name: Контрагенты
    fields:
      - { name: Ссылка, type: УникальныйИдентификатор, key: true }
      - { name: Код, type: Строка(9) }
      - { name: Наименование, type: Строка(100) }
      - { name: ИНН, type: Строка(12) }
      - { name: Телефон, type: Строка(20) }
      - { name: КонтактноеЛицо, type: Строка(100) }
      - { name: ПометкаУдаления, type: Булево }

  - kind: Справочник
    name: ЕдиницыИзмерения
    fields:
      - { name: Ссылка, type: УникальныйИдентификатор, key: true }
      - { name: Код, type: Строка(9) }
      - { name: Наименование, type: Строка(25) }
      - { name: ПометкаУдаления, type: Булево }

  - kind: Справочник
    name: Склады
    fields:
      - { name: Ссылка, type: УникальныйИдентификатор, key: true }
      - { name: Код, type: Строка(9) }
      - { name: Наименование, type: Строка(50) }
      - { name: ПометкаУдаления, type: Булево }

  # ── Документы ──────────────────────────────────────────────────

  - kind: Документ
    name: ПоступлениеТоваров
    fields:
      - { name: Ссылка, type: УникальныйИдентификатор, key: true }
      - { name: Номер, type: Строка(11) }
      - { name: Дата, type: Дата }
      - { name: Контрагент, type: Ссылка, refs: Справочник.Контрагенты }
      - { name: Склад, type: Ссылка, refs: Справочник.Склады }
      - { name: СуммаДокумента, type: "Число(15,2)" }
      - { name: Проведен, type: Булево }
    tabular:
      - name: Товары
        fields:
          - { name: Ссылка, type: Ссылка, refs: Документ.ПоступлениеТоваров }
          - { name: НомерСтроки, type: "Число(5,0)" }
          - { name: Товар, type: Ссылка, refs: Справочник.Товары }
          - { name: Количество, type: "Число(15,3)" }
          - { name: Цена, type: "Число(15,2)" }
          - { name: Сумма, type: "Число(15,2)" }

  - kind: Документ
    name: РеализацияТоваров
    fields:
      - { name: Ссылка, type: УникальныйИдентификатор, key: true }
      - { name: Номер, type: Строка(11) }
      - { name: Дата, type: Дата }
      - { name: Контрагент, type: Ссылка, refs: Справочник.Контрагенты }
      - { name: Склад, type: Ссылка, refs: Справочник.Склады }
      - { name: СуммаДокумента, type: "Число(15,2)" }
      - { name: Проведен, type: Булево }
    tabular:
      - name: Товары
        fields:
          - { name: Ссылка, type: Ссылка, refs: Документ.РеализацияТоваров }
          - { name: НомерСтроки, type: "Число(5,0)" }
          - { name: Товар, type: Ссылка, refs: Справочник.Товары }
          - { name: Количество, type: "Число(15,3)" }
          - { name: Цена, type: "Число(15,2)" }
          - { name: Сумма, type: "Число(15,2)" }

  # ── Регистры ───────────────────────────────────────────────────

  # Остатки товаров по складам: пишут оба документа.
  - kind: РегистрНакопления
    name: ТоварыНаСкладах
    view: Остатки
    dimensions:
      - { name: Товар, type: Ссылка, refs: Справочник.Товары }
      - { name: Склад, type: Ссылка, refs: Справочник.Склады }
    resources:
      - { name: Количество, type: "Число(15,3)" }

  # Обороты продаж: пишет только реализация. Остатков у него нет.
  - kind: РегистрНакопления
    name: Продажи
    view: Обороты
    dimensions:
      - { name: Товар, type: Ссылка, refs: Справочник.Товары }
      - { name: Контрагент, type: Ссылка, refs: Справочник.Контрагенты }
    resources:
      - { name: Количество, type: "Число(15,3)" }
      - { name: Сумма, type: "Число(15,2)" }

  # Цены с историей: цена живёт в регистре, а не реквизитом товара.
  - kind: РегистрСведений
    name: ЦеныТоваров
    periodic: true
    dimensions:
      - { name: Товар, type: Ссылка, refs: Справочник.Товары }
    resources:
      - { name: Цена, type: "Число(15,2)" }
