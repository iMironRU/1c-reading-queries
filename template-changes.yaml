# Журнал изменений файлов шаблона между версиями.
# Используется командой ./book.sh sync для предложения конкретных файлов к обновлению.
#
# Формат:
#   vX.Y.Z:
#     added:    [ список новых файлов ]
#     changed:  [ список изменённых файлов ]
#     removed:  [ список удалённых файлов ]

v0.1.0:
  added:
    - "CLAUDE.md"
    - "book.sh"
    - "book.toml"
    - "metadata.yaml"
    - "CHANGELOG.md"
    - "SUMMARY.md"
    - "VERSION"
    - "template-changes.yaml"
    - "theme/book-extra.css"
    - "spec/constitution.md"
    - "spec/specification.md"
    - "spec/decisions.md"
    - "docs/style-guide.md"
    - "docs/writing-workflow.md"
    - ".claude/commands/book-write.md"
    - ".claude/commands/book-analyze.md"
    - ".claude/commands/book-plan.md"
    - ".github/workflows/build-release.yml"
    - ".github/workflows/build-nightly.yml"
    - ".github/workflows/check-template.yml"
  changed: []
  removed: []

# v0.2.0 — панель ревью (мультимодельная) + штамп сборки.
# Печатное издание и runnable-листинги вынесены в v0.3.0 / v0.4.0 (отдельные потоки).
v0.2.0:
  added:
    - "scripts/review.py"
    - "scripts/status.sh"
    - "scripts/prompts/deepseek-fact.md"
    - "scripts/prompts/gemini-adversary.md"
    - "scripts/prompts/openai-structure.md"
    - "scripts/prompts/openai-metaphor.md"
    - "scripts/prompts/openai-tone.md"
    - "scripts/prompts/openai-style.md"
    - "docs/review-workflow.md"
    - ".env.example"
    - ".gitignore"
  changed:
    - "book.sh"   # build-info штамп (build-date/commit) + version.js с rev, опциональный -H assets/print/header.tex,
                  # заголовки SUMMARY и status из H1/H2 вместо транслита имён файлов,
                  # обрезка заголовков по символам (кириллица больше не рвётся)
    - "docs/style-guide.md"  # единый канон стиля серии (советский учебник, «мы»+«вы»)
    - "theme/book-extra.css" # callout-блоки, иерархия заголовков, стили печати страницы
    - ".github/workflows/build-release.yml"  # texlive-latex-extra (нужен для колонтитулов)
    - ".github/workflows/build-nightly.yml"  # texlive-latex-extra
  removed: []

